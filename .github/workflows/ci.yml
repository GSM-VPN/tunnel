name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -s SPEC.md
          test -s STEP.md
          test -s README.md
          test -s docs/development.md
          for template in feature bug docs refactor change; do
            test -s ".github/ISSUE_TEMPLATE/${template}.md"
          done
          test -s .github/pull_request_template.md

      - name: Check issue and pull request templates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          required_sections=(
            'feature.md|기능 설명|문제 또는 배경|제안하는 해결 방법|수용 기준|참고 자료'
            'bug.md|버그 설명|재현 방법|기대한 동작|실제 동작|실행 환경|로그 및 첨부 자료'
            'docs.md|문서 대상|변경 내용|변경 이유|완료 기준|참고 자료'
            'refactor.md|리팩터링 대상|현재 문제|제안하는 변경|변경 범위|완료 기준|참고 자료'
            'change.md|변경 내용|변경 이유|영향 범위|수용 기준|참고 자료'
          )
          for definition in "${required_sections[@]}"; do
            template="${definition%%|*}"
            sections="${definition#*|}"
            IFS='|' read -ra section_list <<< "$sections"
            for section in "${section_list[@]}"; do
              grep -qF "## ${section}" ".github/ISSUE_TEMPLATE/${template}"
            done
          done
          if [[ "$EVENT_NAME" == pull_request ]]; then
            for section in '변경 사항' '변경 이유' '관련 이슈' '주요 변경 내용' '테스트' '체크리스트' '스크린샷 및 참고 자료'; do
              grep -qF "## ${section}" <<< "$PR_BODY"
            done
            grep -Eqi '(closes|fixes|resolves)[[:space:]]+#[0-9]+' <<< "$PR_BODY"
          fi

      - name: Check whitespace errors
        run: git diff --check

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit locked dependencies
        run: cargo audit

