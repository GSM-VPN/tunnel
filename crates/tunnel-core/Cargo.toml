[package]
name = "tunnel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust data-plane foundation for the GSM Tunnel engine"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tunnel-core"
path = "src/tunnel_core_bin.rs"

[lints]
workspace = true

[dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
snow = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
proptest = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

